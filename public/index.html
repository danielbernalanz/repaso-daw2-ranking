<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repaso 1ª evaluación DAW 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout: cabecera fija con navegación por asignatura; contenido en una columna de 1100px; el espacio de trabajo de práctica es un editor a la derecha y requisitos a la izquierda. */
:root {
  --bg: #f1f4f8; --surface: #ffffff; --ink: #17202e; --muted: #536073; --line: #d6dde8;
  --acc: #3b5bdb; --acc-ink: #ffffff; --acc-soft: #e6ebfd;
  --ok: #0f7a52; --ok-soft: #dff4ea; --bad: #b3261e; --bad-soft: #fbe5e3; --warn: #8a5a00;
  --ed-bg: #101826; --ed-ink: #e3e9f4; --ed-gut: #6d7b93; --ed-line: #223049;
  --f-head: 'Space Grotesk', system-ui, sans-serif; --f-body: 'Inter', system-ui, sans-serif; --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131c; --surface: #151d2a; --ink: #e5eaf2; --muted: #9aa8bc; --line: #26334a;
    --acc: #8aa0ff; --acc-ink: #0d131c; --acc-soft: #1f2a4a;
    --ok: #4fd1a0; --ok-soft: #12332a; --bad: #ff8f86; --bad-soft: #3a1d1b; --warn: #e0b04a;
    --ed-bg: #0a101a; --ed-ink: #dfe6f2; --ed-gut: #56637a; --ed-line: #1a2538;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131c; --surface: #151d2a; --ink: #e5eaf2; --muted: #9aa8bc; --line: #26334a;
  --acc: #8aa0ff; --acc-ink: #0d131c; --acc-soft: #1f2a4a;
  --ok: #4fd1a0; --ok-soft: #12332a; --bad: #ff8f86; --bad-soft: #3a1d1b; --warn: #e0b04a;
  --ed-bg: #0a101a; --ed-ink: #dfe6f2; --ed-gut: #56637a; --ed-line: #1a2538;
  color-scheme: dark;
}
/* acento por asignatura */
[data-mod="dep"] { --acc: #3b5bdb; --acc-soft: #e6ebfd; }
[data-mod="dwes"] { --acc: #a8500a; --acc-soft: #fbeadb; }
[data-mod="diw"] { --acc: #a3236f; --acc-soft: #fbe3f2; }
[data-mod="sos"] { --acc: #0d7a4d; --acc-soft: #dcf3e8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-mod="dep"], :root:not([data-theme="light"]) body[data-mod="dep"] { --acc: #8aa0ff; --acc-soft: #1f2a4a; }
  :root:not([data-theme="light"]) [data-mod="dwes"], :root:not([data-theme="light"]) body[data-mod="dwes"] { --acc: #f0a45c; --acc-soft: #3a2614; }
  :root:not([data-theme="light"]) [data-mod="diw"], :root:not([data-theme="light"]) body[data-mod="diw"] { --acc: #f07ec1; --acc-soft: #3b1a30; }
  :root:not([data-theme="light"]) [data-mod="sos"], :root:not([data-theme="light"]) body[data-mod="sos"] { --acc: #52d6a0; --acc-soft: #12332a; }
}
:root[data-theme="dark"] [data-mod="dep"], :root[data-theme="dark"] body[data-mod="dep"] { --acc: #8aa0ff; --acc-soft: #1f2a4a; }
:root[data-theme="dark"] [data-mod="dwes"], :root[data-theme="dark"] body[data-mod="dwes"] { --acc: #f0a45c; --acc-soft: #3a2614; }
:root[data-theme="dark"] [data-mod="diw"], :root[data-theme="dark"] body[data-mod="diw"] { --acc: #f07ec1; --acc-soft: #3b1a30; }
:root[data-theme="dark"] [data-mod="sos"], :root[data-theme="dark"] body[data-mod="sos"] { --acc: #52d6a0; --acc-soft: #12332a; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1rem; margin-bottom: .5rem; }
button, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 1.25rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* cabecera */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem; padding-block: .6rem; }
.brand { display: flex; align-items: center; gap: .6rem; font-family: var(--f-head); font-weight: 700; color: var(--ink); text-decoration: none; }
.bm { background: var(--ink); color: var(--bg); padding: .1rem .5rem; border-radius: 4px; font-size: .85rem; }
.mods { display: flex; flex-wrap: wrap; gap: .25rem; margin-left: auto; }
.mods a { color: var(--muted); text-decoration: none; padding: .35rem .7rem; border-radius: 6px; font-weight: 500; }
.mods a:hover { background: var(--bg); color: var(--ink); }
.mods a.on { background: var(--ink); color: var(--bg); }
.tbtn { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: .3rem .7rem; cursor: pointer; }
.tbtn:hover { border-color: var(--muted); }

/* inicio */
.hero { padding-block: 1rem 1.5rem; max-width: 70ch; }
.hero h1 { margin-bottom: .75rem; }
.hero p { color: var(--muted); margin: 0; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 1rem; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--acc); border-radius: 8px; padding: 1.1rem; display: flex; flex-direction: column; gap: .7rem; min-width: 0; }
.mcard .ras { margin: 0; color: var(--acc); font-weight: 600; } .mcard .ras span { color: var(--muted); font-weight: 400; }
.nums { display: flex; flex-direction: column; gap: .15rem; color: var(--muted); } .nums strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.mini { display: grid; gap: .25rem; font-size: .85rem; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: auto; padding-top: .3rem; }
.links a { color: var(--acc-ink); background: var(--acc); padding: .4rem .8rem; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: .9rem; }
.links a:nth-child(n+2) { background: transparent; color: var(--acc); border: 1px solid var(--acc); }
.foot { color: var(--muted); margin-top: 1.5rem; max-width: 70ch; }
.bar-track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--acc); }

/* módulo */
.mhead { margin-bottom: 1.25rem; }
.mhead h1 { color: var(--acc); }
.nota { color: var(--muted); max-width: 80ch; margin: .6rem 0 1rem; }
.tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); }
.tabs a { padding: .55rem 1rem; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs a.on { color: var(--acc); border-color: var(--acc); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem; display: grid; gap: 1rem; min-width: 0; }
.lead { color: var(--muted); max-width: 75ch; margin: 0 0 1rem; }
.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: .1rem .5rem; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.pill.ra { background: var(--acc-soft); color: var(--acc); border-color: transparent; }
.tag { display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .6rem; font-size: .88rem; }
.tag .crit { color: var(--ink); font-weight: 500; }
.tag .ap { color: var(--muted); }
.tag .ap::before { content: "· "; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
.cnt { color: var(--muted); margin-left: auto; }
.btn { background: var(--acc); color: var(--acc-ink); border: 0; padding: .55rem 1.1rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.alt { background: transparent; color: var(--acc); border: 1px solid var(--acc); }
.link { background: none; border: 0; color: var(--acc); cursor: pointer; text-decoration: underline; padding: .25rem 0; justify-self: start; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .4rem .6rem; min-width: 0; max-width: 100%; }

/* selección de teoría */
.rafs { border: 1px solid var(--line); border-radius: 8px; padding: .75rem 1rem 1rem; margin: 0; display: grid; gap: .6rem; min-width: 0; }
.rafs legend { padding: 0 .4rem; }
.ratitle { margin: 0; color: var(--muted); font-size: .9rem; }
.chks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: .25rem .75rem; }
.chk { display: flex; align-items: flex-start; gap: .5rem; cursor: pointer; font-size: .92rem; }
.chk input { margin-top: .25rem; accent-color: var(--acc); }
.chk em { margin-left: auto; font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }

/* test */
.quiz { gap: 1rem; }
.qtop { display: grid; gap: .4rem; font-size: .85rem; color: var(--muted); }
.qtext { font-size: 1.2rem; max-width: 70ch; }
.hintline { color: var(--muted); margin: 0; font-size: .88rem; }
.opts { display: grid; gap: .5rem; }
.opt { display: flex; gap: .75rem; align-items: flex-start; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .7rem .9rem; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--acc); }
.opt.picked { border-color: var(--acc); background: var(--acc-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.ltr { font-family: var(--f-mono); font-weight: 600; color: var(--muted); min-width: 1.2rem; }
.fb { padding: .8rem 1rem; border-radius: 8px; margin: 0; }
.fb.ok { background: var(--ok-soft); color: var(--ink); border-left: 4px solid var(--ok); }
.fb.ko { background: var(--bad-soft); color: var(--ink); border-left: 4px solid var(--bad); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td.bcell { width: 22%; min-width: 90px; }
tr.hole td { background: var(--bad-soft); }
.fails { margin: 0; padding-left: 1.2rem; display: grid; gap: .35rem; }

/* práctica */
.pgroup { margin-bottom: 1.5rem; display: grid; gap: .75rem; }
.pgroup h2 { font-size: 1.05rem; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: .75rem; }
.pcard { display: flex; flex-direction: column; gap: .4rem; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; cursor: pointer; min-width: 0; }
.pcard:hover { border-color: var(--acc); }
.pcard.done { border-color: var(--ok); }
.ptitle { font-weight: 600; font-family: var(--f-head); }
.ptags { display: flex; flex-wrap: wrap; gap: .3rem; }
.pap { color: var(--muted); font-size: .85rem; }
.pstate { font-size: .8rem; font-weight: 600; color: var(--muted); } .pcard.done .pstate { color: var(--ok); }
.ws { display: grid; gap: 1rem; }
.wshead { display: grid; gap: .5rem; }
.brief { margin: 0; max-width: 85ch; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--acc); border-radius: 8px; padding: .8rem 1rem; }
.wsgrid { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 1rem; align-items: start; }
.wsgrid.single { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
.lcol, .rcol { display: grid; gap: .9rem; min-width: 0; }
.lcol { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; }
.meter { display: grid; gap: .35rem; font-size: .85rem; color: var(--muted); font-weight: 600; }
.success { background: var(--ok-soft); border: 1px solid var(--ok); border-radius: 8px; padding: .7rem .9rem; font-weight: 600; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.checks li { display: grid; grid-template-columns: 1.4rem 1fr; gap: .4rem; font-size: .9rem; color: var(--muted); }
.checks li.ok { color: var(--ink); } .checks li.ok .mk { color: var(--ok); font-weight: 700; }
.help { display: grid; gap: .4rem; }
.help ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .3rem; }
.hh { margin: 0; font-weight: 600; color: var(--warn); font-size: .85rem; }
.sol { overflow-x: auto; } .sol pre { background: var(--ed-bg); color: var(--ed-ink); padding: .8rem; border-radius: 6px; margin: 0; font: 13px/1.5 var(--f-mono); }
.ftabs { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; }
.ft { background: var(--surface); border: 1px solid var(--line); border-radius: 6px 6px 0 0; padding: .35rem .8rem; cursor: pointer; font: 500 .82rem var(--f-mono); max-width: 100%; overflow-wrap: anywhere; }
.ft.on { background: var(--ed-bg); color: var(--ed-ink); border-color: var(--ed-bg); }
.lang { margin-left: auto; color: var(--muted); font: 600 .75rem var(--f-mono); text-transform: uppercase; }
.editor { position: relative; display: grid; grid-template-columns: 3rem minmax(0, 1fr); background: var(--ed-bg); border-radius: 0 6px 6px 6px; min-height: 260px; height: 320px; overflow: hidden; }
.gut { white-space: pre; text-align: right; padding: .8rem .5rem; color: var(--ed-gut); font: 13px/1.55 var(--f-mono); border-right: 1px solid var(--ed-line); overflow: hidden; user-select: none; }
.editor textarea { background: transparent; color: var(--ed-ink); border: 0; resize: none; padding: .8rem; font: 13px/1.55 var(--f-mono); white-space: pre; overflow: auto; width: 100%; min-width: 0; height: 100%; tab-size: 2; }
.editor.ro textarea { opacity: .75; }
.editor textarea:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
.cap { margin: 0; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.prev { width: 100%; height: 260px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.cls { display: grid; gap: .5rem; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, 200px); gap: .75rem; align-items: center; padding: .5rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.crow.ok { border-color: var(--ok); background: var(--ok-soft); } .crow.ko { border-color: var(--bad); background: var(--bad-soft); }
.crow label { overflow-wrap: anywhere; }
.ord { list-style: none; counter-reset: o; margin: 0; padding: 0; display: grid; gap: .45rem; }
.ord li { counter-increment: o; display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem; background: var(--bg); }
.ord li::before { content: counter(o); position: absolute; }
.ord li { position: relative; padding-left: 2.2rem; }
.ord li::before { left: .75rem; font-family: var(--f-mono); color: var(--muted); }
.ord li.okpos { border-color: var(--ok); background: var(--ok-soft); }
.ob { display: flex; gap: .25rem; } .ob button { width: 2rem; height: 2rem; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; }
.ob button:disabled { opacity: .35; cursor: default; }
@media (max-width: 900px) { .wsgrid { grid-template-columns: minmax(0, 1fr); } .cnt { margin-left: 0; } .mods { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* resumen de RA */
.sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 1rem; }
.sumblock { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--acc); border-radius: 8px; padding: 1.1rem; display: grid; gap: .9rem; min-width: 0; align-content: start; }
.sumblock h2 a { color: var(--acc); text-decoration: none; }
.sumra h3 { font-size: .95rem; margin-bottom: .4rem; font-weight: 500; }
.sumra ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .15rem; font-size: .9rem; color: var(--muted); }
.sumra li b { color: var(--ink); font-family: var(--f-mono); }
.sumnote { margin: 0; font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: .6rem; }

/* examen vs tarea */
.est { display: inline-block; font-size: .72rem; font-weight: 600; padding: .05rem .5rem; border-radius: 99px; margin-left: .5rem; vertical-align: middle; white-space: normal; }
.est.examen { background: var(--ok-soft); color: var(--ok); }
.est.parcial { background: var(--acc-soft); color: var(--acc); }
.est.tarea { background: var(--bad-soft); color: var(--bad); }
.chk.incl { padding: .6rem .8rem; border: 1px dashed var(--line); border-radius: 8px; }
.tnote { margin: 0; padding: .45rem .7rem; background: var(--bad-soft); color: var(--ink); border-left: 4px solid var(--bad); border-radius: 6px; font-size: .88rem; }
.pcard.tarea { opacity: .8; border-style: dashed; }
.enT { color: var(--muted); font-style: normal; }
.sumblock.split { grid-column: 1 / -1; }
.sumblock.split .sumra ul { gap: .55rem; }
.legend { display: flex; flex-wrap: wrap; gap: .5rem; } .legend .est { margin: 0; }
.sumexam { margin: 0; font-weight: 500; }
.tareas { border: 1px solid var(--line); border-radius: 8px; padding: .8rem 1rem; background: var(--bg); }
.tareas h3 { margin-bottom: .4rem; font-size: .95rem; }
.tareas ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .5rem; font-size: .9rem; }
.tcub { display: block; color: var(--muted); font-size: .82rem; }
.sumra li.row { padding: .5rem .7rem; border-radius: 8px; border-left: 4px solid var(--line); list-style: none; margin-left: -1.1rem; background: var(--bg); }
.sumra li.row.examen { border-left-color: var(--ok); }
.sumra li.row.parcial { border-left-color: var(--acc); }
.sumra li.row.tarea { border-left-color: var(--bad); }
.dentro, .fuera { display: block; font-size: .84rem; margin-top: .2rem; }
.dentro { color: var(--ok); } .fuera { color: var(--bad); }

/* Juego y ranking: usa los tokens de style.css (temas claro/oscuro y acento por asignatura). */
.mods a.rk-link { color: var(--acc); font-weight: 600; }
.mods a.rk-link.on { color: var(--bg); }
.game { padding-top: 1rem; padding-bottom: 2rem; }
.gh { font-family: var(--f-head, inherit); margin: 0 0 .75rem; }
.nickform { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.nickform input { flex: 1 1 10rem; min-width: 0; padding: .45rem .6rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.nickform .cap { flex-basis: 100%; margin: 0; }
.gnote { background: var(--acc-soft); border: 1px solid var(--line); border-radius: 6px; padding: .5rem .75rem; margin: .75rem 0; }
.gbar { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: space-between; align-items: center; margin: .75rem 0; }
.gtabs { display: flex; flex-wrap: wrap; gap: .35rem; }
.gt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: .3rem .7rem; cursor: pointer; font: inherit; }
.gt.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.gsum { font-weight: 600; margin: .5rem 0; }
table.rk { width: 100%; border-collapse: collapse; }
table.rk th, table.rk td { padding: .4rem .5rem; text-align: right; border-bottom: 1px solid var(--line); }
table.rk th:nth-child(2), table.rk td.nm { text-align: left; overflow-wrap: anywhere; }
table.rk tr.me { background: var(--acc-soft); font-weight: 700; box-shadow: inset 4px 0 0 var(--acc); }
.bdg { color: var(--acc); font-size: .85em; }
.mybadges { margin-top: 1rem; }
.bl { list-style: none; padding: 0; margin: .5rem 0; display: flex; flex-wrap: wrap; gap: .35rem; }

MODS.dep = {
  id: 'dep', nombre: 'Despliegue de aplicaciones web', corto: 'Despliegue', color: 'dep',
  nota: 'Evaluados en la 1ª evaluación (no dualizados): RA2 y RA4. RA1, RA5 y RA6 son dualizados y no se evalúan aquí. Fuente: Resumen de la programación DAW2D 26-27.',
  ras: [
    { ra: 'RA2', titulo: 'Implanta aplicaciones web en servidores web, evaluando y aplicando criterios de configuración para su funcionamiento seguro.',
      crits: {
        a: 'Parámetros de administración más importantes del servidor web',
        b: 'Ampliar la funcionalidad del servidor mediante módulos',
        c: 'Sitios virtuales',
        d: 'Autenticación y control de acceso',
        e: 'Certificados digitales',
        f: 'Comunicaciones seguras cliente-servidor',
        g: 'Documentación de configuración y administración segura',
        h: 'Ajustes para la implantación de aplicaciones en el servidor web',

    { ra: 'RA4', titulo: 'Administra servidores de transferencia de archivos, evaluando y aplicando criterios de configuración que garanticen la disponibilidad del servicio.',
      crits: {
        a: 'Instalar y configurar servidores de transferencia de archivos',
        b: 'Usuarios y grupos para el acceso remoto',
        c: 'Acceso en modo activo y pasivo',
        d: 'Pruebas con clientes en línea de comandos y en modo gráfico',
        e: 'Protocolo seguro de transferencia de archivos',
        f: 'Transferencia de archivos integrada en servidores web',
        g: 'Documentación del servicio de transferencia de archivos',
        h: 'Virtualización: servidores de transferencia en la nube y contenedores'
      } }
  ],
  theory: [
    // ---------- RA2 ----------
    { ra: 'RA2', crit: 'a', ap: 'UD1 · Configuración general de Apache', q: 'En Debian/Ubuntu, ¿qué fichero es el principal de configuración de Apache?', opts: ['/etc/apache2/apache2.conf', '/etc/httpd/httpd.conf', '/var/www/html/index.html', '/etc/apache2/sites-available/000-default.conf'], ans: [0], why: 'apache2.conf es el fichero raíz; desde él se incluyen ports.conf, mods-enabled, conf-enabled y sites-enabled. /etc/httpd/httpd.conf es el de la familia Red Hat.' },
    { ra: 'RA2', crit: 'a', ap: 'UD1 · Configuración general de Apache', q: '¿Qué directiva define el directorio raíz de documentos de un sitio?', opts: ['ServerRoot', 'DocumentRoot', 'DirectoryIndex', 'Alias'], ans: [1], why: 'DocumentRoot indica el directorio desde el que se sirven los ficheros. ServerRoot es la raíz de la instalación de Apache.' },
    { ra: 'RA2', crit: 'a', ap: 'UD1 · Configuración general de Apache', q: '¿Qué hace la directiva DirectoryIndex?', opts: ['Lista el contenido de los directorios', 'Define qué fichero se sirve cuando se pide un directorio', 'Prohíbe el acceso a un directorio', 'Define el puerto de escucha'], ans: [1], why: 'DirectoryIndex establece los ficheros por defecto (index.html, index.php…) que se devuelven al pedir un directorio.' },
    { ra: 'RA2', crit: 'a', ap: 'UD1 · Configuración general de Apache', q: '¿En qué fichero se declara normalmente el puerto en el que escucha Apache en Debian?', opts: ['ports.conf', 'envvars', 'magic', 'mime.types'], ans: [0], why: 'ports.conf contiene las directivas Listen (80 y 443 con SSL).' },
    { ra: 'RA2', crit: 'a', ap: 'UD1 · Configuración general de Apache', q: '¿Cómo se comprueba la sintaxis de la configuración antes de recargar Apache?', opts: ['apache2ctl configtest', 'apache2 --restart', 'systemctl enable apache2', 'a2enconf test'], ans: [0], why: 'apache2ctl configtest (o apachectl -t) valida la sintaxis y devuelve "Syntax OK".' },
    { ra: 'RA2', crit: 'b', ap: 'UD1 · Módulos', q: '¿Qué comando activa el módulo de reescritura de URLs en Debian?', opts: ['a2enmod rewrite', 'a2ensite rewrite', 'apt install rewrite', 'a2enconf rewrite'], ans: [0], why: 'a2enmod crea el enlace en mods-enabled. Después hay que recargar Apache.' },
    { ra: 'RA2', crit: 'b', ap: 'UD1 · Módulos', q: '¿Dónde se guardan los módulos disponibles y los activados?', opts: ['mods-available y mods-enabled', 'sites-available y sites-enabled', 'conf-available y conf-enabled', 'modules y active'], ans: [0], why: 'Los módulos se escriben en mods-available y a2enmod crea un enlace simbólico en mods-enabled.' },
    { ra: 'RA2', crit: 'b', ap: 'UD1 · Módulos', q: '¿Qué módulo hay que activar para usar HTTPS?', opts: ['mod_ssl', 'mod_alias', 'mod_dir', 'mod_php'], ans: [0], why: 'mod_ssl aporta SSLEngine y las directivas de certificados (a2enmod ssl).' },
    { ra: 'RA2', crit: 'c', ap: 'UD2 · Hosts virtuales', q: '¿Cuántos tipos de hosts virtuales existen en Apache según las prácticas de clase?', opts: ['Basados en nombre, en IP y en puerto', 'Solo basados en nombre', 'Solo basados en IP', 'Basados en usuario y en grupo'], ans: [0], why: 'Se distinguen por nombre (ServerName, el más usado), por dirección IP o por puerto (distintos Listen y VirtualHost). Técnicamente la documentación de Apache habla de basados en nombre y en IP, y el puerto es una variante.' },
    { ra: 'RA2', crit: 'c', ap: 'UD2 · Hosts virtuales', q: '¿Qué directiva permite que un VirtualHost responda también a otro nombre (por ejemplo sin www)?', opts: ['ServerAlias', 'Alias', 'Redirect', 'ServerAdmin'], ans: [0], why: 'ServerAlias añade nombres alternativos al sitio. Alias, en cambio, mapea una URL a un directorio.' },
    { ra: 'RA2', crit: 'c', ap: 'UD2 · Hosts virtuales', q: '¿Qué comando habilita un sitio cuyo fichero está en sites-available?', opts: ['a2ensite nombre', 'a2enmod nombre', 'ln -s mods-enabled nombre', 'apache2ctl sites nombre'], ans: [0], why: 'a2ensite crea el enlace en sites-enabled; a2dissite lo elimina.' },
    { ra: 'RA2', crit: 'c', ap: 'UD2 · Hosts virtuales', q: 'Para probar un host virtual por nombre sin DNS real, ¿qué se hace en el cliente?', opts: ['Añadir la línea IP nombre en /etc/hosts', 'Cambiar el DocumentRoot', 'Instalar bind9 en el servidor', 'Editar ports.conf'], ans: [0], why: 'Con /etc/hosts el cliente resuelve el nombre del sitio a la IP del servidor sin necesidad de DNS.' },
    { ra: 'RA2', crit: 'd', ap: 'UD2 · Autenticación y control de acceso', q: '¿Qué utilidad crea el fichero de contraseñas para la autenticación básica?', opts: ['htpasswd', 'passwd', 'ssh-keygen', 'openssl req'], ans: [0], why: 'htpasswd -c crea el fichero y añade el primer usuario; sin -c añade usuarios a un fichero existente.' },
    { ra: 'RA2', crit: 'd', ap: 'UD2 · Autenticación y control de acceso', q: '¿Qué directiva exige que el usuario se haya autenticado correctamente (Apache 2.4)?', opts: ['Require valid-user', 'Allow from all', 'Order allow,deny', 'AuthType None'], ans: [0], why: 'Require valid-user acepta a cualquier usuario válido del AuthUserFile. Order/Allow son de Apache 2.2.' },
    { ra: 'RA2', crit: 'd', ap: 'UD2 · Autenticación y control de acceso', q: 'Un administrador usa autenticación básica sin HTTPS. ¿Cuál es el problema?', opts: ['Las credenciales viajan codificadas en Base64, no cifradas', 'Apache no lo permite', 'Solo funciona con IPv6', 'Caduca cada hora'], ans: [0], why: 'Base64 es solo codificación. Cualquiera que capture el tráfico lee usuario y contraseña, por eso se combina con HTTPS.' },
    { ra: 'RA2', crit: 'd', ap: 'UD2 · Autenticación y control de acceso', q: '¿Qué permite el fichero .htaccess?', opts: ['Configurar un directorio sin tocar la configuración global, si AllowOverride lo permite', 'Guardar los certificados', 'Definir los puertos', 'Cambiar el usuario del sistema'], ans: [0], why: '.htaccess aplica directivas por directorio; solo se lee si AllowOverride no es None, y penaliza el rendimiento.' },
    { ra: 'RA2', crit: 'e', ap: 'UD2 · Certificados digitales', q: '¿Qué comando genera una clave privada y un certificado autofirmado?', opts: ['openssl req -x509 -nodes -newkey rsa:2048 -keyout k.key -out c.crt', 'htpasswd -c c.crt', 'ssh-keygen -t c.crt', 'a2enmod certificado'], ans: [0], why: 'openssl req -x509 crea un certificado autofirmado junto con su clave. Sirve para pruebas, pero los navegadores lo marcan como no confiable.' },
    { ra: 'RA2', crit: 'e', ap: 'UD2 · Certificados digitales', q: '¿Qué diferencia un certificado emitido por una CA de uno autofirmado?', opts: ['El de la CA está firmado por una autoridad en la que confía el navegador', 'El autofirmado cifra mejor', 'El de la CA no necesita clave privada', 'No hay diferencia técnica ni de confianza'], ans: [0], why: 'La cadena de confianza la aporta la CA. El cifrado es el mismo; cambia quién avala la identidad.' },
    { ra: 'RA2', crit: 'e', ap: 'UD2 · Certificados digitales', q: '¿Qué fichero NO debe compartirse nunca al instalar un certificado?', opts: ['La clave privada', 'El certificado público', 'La cadena de CA', 'El nombre de dominio'], ans: [0], why: 'La clave privada demuestra que eres el dueño del certificado. Si se filtra, hay que revocarlo.' },
    { ra: 'RA2', crit: 'f', ap: 'UD2 · Comunicaciones seguras', q: '¿En qué puerto escucha HTTPS por defecto?', opts: ['443', '80', '8080', '22'], ans: [0], why: 'HTTP usa 80, HTTPS 443, SSH 22.' },
    { ra: 'RA2', crit: 'f', ap: 'UD2 · Comunicaciones seguras', q: '¿Qué directiva activa TLS en un VirtualHost?', opts: ['SSLEngine on', 'SSLActive 1', 'HTTPS on', 'EnableTLS yes'], ans: [0], why: 'SSLEngine on, junto a SSLCertificateFile y SSLCertificateKeyFile.' },
    { ra: 'RA2', crit: 'f', ap: 'UD2 · Comunicaciones seguras', q: '¿Cómo se fuerza que todo el tráfico HTTP pase a HTTPS?', opts: ['Con un VirtualHost *:80 que redirige al sitio https', 'Cerrando el puerto 443', 'Desactivando mod_ssl', 'Cambiando DirectoryIndex'], ans: [0], why: 'Un VirtualHost en el 80 con Redirect permanent / https://… envía a los clientes al sitio seguro.' },
    { ra: 'RA2', crit: 'g', ap: 'Documentación y seguridad', q: '¿Qué debe incluir la documentación de la configuración de un servidor web?', opts: ['Ficheros modificados, parámetros y su motivo, comandos y pruebas realizadas', 'Solo la contraseña de root', 'Únicamente capturas del navegador', 'Nada, el servidor se autodocumenta'], ans: [0], why: 'Debe permitir a otra persona reproducir y mantener la configuración, y no incluir secretos como contraseñas.' },
    { ra: 'RA2', crit: 'g', ap: 'Documentación y seguridad', q: '¿Cuál es una recomendación de administración segura de Apache?', opts: ['Ocultar versión con ServerTokens Prod y ServerSignature Off', 'Dejar el listado de directorios activo', 'Ejecutar Apache como root', 'Usar siempre el usuario admin'], ans: [0], why: 'Reducir la información expuesta dificulta los ataques dirigidos. Apache no debe correr como root ni listar directorios innecesariamente (Options -Indexes).' },
    { ra: 'RA2', crit: 'h', ap: 'UD1 · Ajustes de implantación', q: 'Una aplicación PHP no se ejecuta y el navegador muestra el código. ¿Qué falta?', opts: ['Instalar y activar el módulo/intérprete de PHP en Apache', 'Abrir el puerto 22', 'Un certificado', 'Cambiar ServerAdmin'], ans: [0], why: 'Sin libapache2-mod-php (o PHP-FPM) Apache sirve el fichero como texto.' },
    { ra: 'RA2', crit: 'h', ap: 'UD1 · Ajustes de implantación', q: '¿Qué usuario ejecuta normalmente los procesos de Apache en Debian y es el que necesita permisos de lectura sobre la web?', opts: ['www-data', 'root', 'apache2user', 'daemon-web'], ans: [0], why: 'Los ficheros de DocumentRoot deben ser legibles por www-data y el de subida escribible solo donde haga falta.' },
    { ra: 'RA2', crit: 'h', ap: 'UD2 · Alias y Redirect', q: '¿Qué hace Alias /docs /srv/documentos?', opts: ['Sirve el contenido de /srv/documentos al pedir /docs, sin redirigir al cliente', 'Redirige al cliente a otra URL', 'Crea un host virtual', 'Cambia el DocumentRoot global'], ans: [0], why: 'Alias mapea una URL a un directorio fuera del DocumentRoot. Redirect, en cambio, responde con 301/302 y el cliente cambia de URL.' },
    { ra: 'RA2', crit: 'i', ap: 'Contenedores y nube', q: '¿Qué imagen oficial de Docker contiene Apache HTTP Server?', opts: ['httpd', 'apache-server-latest', 'webdav', 'lamp-base'], ans: [0], why: 'httpd:2.4 es la imagen oficial; sirve /usr/local/apache2/htdocs y escucha en el 80.' },
    { ra: 'RA2', crit: 'i', ap: 'Contenedores y nube', q: '¿Qué significa -p 8080:80 en docker run?', opts: ['El puerto 8080 del anfitrión se redirige al 80 del contenedor', 'El puerto 80 del anfitrión va al 8080 del contenedor', 'Abre 8080 y 80 en el anfitrión', 'Limita el contenedor a 80 MB'], ans: [0], why: 'El formato es puertoAnfitrión:puertoContenedor.' },
    { ra: 'RA2', crit: 'i', ap: 'Contenedores y nube', q: '¿Qué ventaja tiene desplegar el servidor web en un contenedor?', opts: ['Entorno reproducible y aislado, fácil de replicar', 'No necesita red', 'Elimina la necesidad de configurar nada', 'Es siempre más rápido que el sistema nativo'], ans: [0], why: 'La imagen fija versiones y dependencias, y el mismo contenedor se despliega en local o en la nube.' },
    { ra: 'RA2', crit: 'j', ap: 'Logs', q: '¿Dónde guarda Apache en Debian los registros de acceso y de error?', opts: ['/var/log/apache2/access.log y error.log', '/etc/apache2/logs', '/var/www/log', '/tmp/apache.log'], ans: [0], why: 'access.log registra cada petición y error.log los fallos. Se pueden separar por VirtualHost con CustomLog y ErrorLog.' },
    { ra: 'RA2', crit: 'j', ap: 'Logs', q: '¿Qué comando permite ver un log en tiempo real?', opts: ['tail -f /var/log/apache2/access.log', 'cat -r access.log', 'head -f access.log', 'less -x access.log'], ans: [0], why: 'tail -f queda a la espera y muestra las líneas nuevas según se escriben.' },
    { ra: 'RA2', crit: 'j', ap: 'Logs', q: 'Una línea de access.log empieza por 192.168.1.20 … ¿qué representa ese primer campo?', opts: ['La IP del cliente que hizo la petición', 'La IP del servidor', 'El puerto', 'El usuario del sistema'], ans: [0], why: 'En formato common/combined, el primer campo es el host remoto (%h).' },
    // ---------- RA4 ----------
    { ra: 'RA4', crit: 'a', ap: 'UD2 · Servidor FTP (vsftpd)', q: '¿Qué paquete instala el servidor FTP usado en clase?', opts: ['vsftpd', 'proftpd-client', 'filezilla-server-web', 'openssh-ftp'], ans: [0], why: 'vsftpd (Very Secure FTP Daemon). Se configura en /etc/vsftpd.conf.' },
    { ra: 'RA4', crit: 'a', ap: 'UD2 · Servidor FTP (vsftpd)', q: '¿Qué puertos usa FTP en modo activo?', opts: ['21 (control) y 20 (datos)', '22 y 23', '80 y 443', '21 y 22'], ans: [0], why: 'El control va por el 21; en activo, el servidor abre los datos desde el 20 hacia el cliente.' },
    { ra: 'RA4', crit: 'a', ap: 'UD2 · Servidor FTP (vsftpd)', q: 'Para impedir el acceso anónimo en vsftpd se pone…', opts: ['anonymous_enable=NO', 'local_enable=NO', 'write_enable=NO', 'listen=NO'], ans: [0], why: 'anonymous_enable=NO. local_enable=YES permite entrar a los usuarios locales del sistema.' },
    { ra: 'RA4', crit: 'b', ap: 'UD2 · Usuarios y grupos', q: '¿Qué directiva enjaula a los usuarios locales en su directorio personal?', opts: ['chroot_local_user=YES', 'local_root=/', 'chown_uploads=YES', 'xferlog_enable=YES'], ans: [0], why: 'chroot_local_user=YES impide que suban por encima de su home. Si la raíz del jail es escribible, hace falta allow_writeable_chroot=YES o una subcarpeta de subida.' },
    { ra: 'RA4', crit: 'b', ap: 'UD2 · Usuarios y grupos', q: '¿Qué hace write_enable=YES?', opts: ['Permite comandos que modifican el sistema de ficheros (subir, borrar, crear)', 'Activa el modo pasivo', 'Activa el cifrado', 'Permite el acceso anónimo'], ans: [0], why: 'Sin write_enable=YES solo se puede descargar y listar.' },
    { ra: 'RA4', crit: 'b', ap: 'UD2 · Usuarios y grupos', q: '¿Qué fichero lista usuarios a los que se deniega FTP cuando userlist_enable=YES y userlist_deny=YES?', opts: ['/etc/vsftpd.userlist', '/etc/passwd', '/etc/shadow', '/etc/ftpusers.conf.d'], ans: [0], why: 'vsftpd lee userlist_file (por defecto /etc/vsftpd.userlist). Con userlist_deny=YES es lista de denegados; con NO, de permitidos. Aparte, /etc/ftpusers (PAM) también deniega.' },
    { ra: 'RA4', crit: 'c', ap: 'UD2 · Modo activo y pasivo', q: 'En modo pasivo, ¿quién abre la conexión de datos?', opts: ['El cliente, hacia un puerto que indica el servidor', 'El servidor hacia el puerto 20 del cliente', 'Ninguno, no hay conexión de datos', 'Un proxy'], ans: [0], why: 'En pasivo ambas conexiones las inicia el cliente, lo que funciona detrás de NAT y cortafuegos.' },
    { ra: 'RA4', crit: 'c', ap: 'UD2 · Modo activo y pasivo', q: '¿Qué hay que configurar en vsftpd para el modo pasivo detrás de un cortafuegos?', opts: ['pasv_enable, pasv_min_port y pasv_max_port, y abrir ese rango', 'Solo abrir el 21', 'Desactivar el login local', 'Cambiar el puerto a 22'], ans: [0], why: 'Se fija un rango (por ejemplo 40000-40100) y se permite en el cortafuegos.' },
    { ra: 'RA4', crit: 'c', ap: 'UD2 · Modo activo y pasivo', q: '¿Qué problema típico tiene el modo activo?', opts: ['El cortafuegos/NAT del cliente bloquea la conexión entrante del servidor', 'No permite subir ficheros', 'No funciona con usuarios locales', 'Solo funciona con IPv6'], ans: [0], why: 'El servidor abre la conexión de datos hacia el cliente, y los cortafuegos del cliente suelen bloquearla.' },
    { ra: 'RA4', crit: 'd', ap: 'UD2 · Clientes FTP', q: 'En el cliente FTP de línea de comandos, ¿qué comando descarga un fichero?', opts: ['get', 'put', 'ls', 'bye'], ans: [0], why: 'get descarga, put sube, mget/mput son las versiones múltiples.' },
    { ra: 'RA4', crit: 'd', ap: 'UD2 · Clientes FTP', q: 'Un cliente gráfico habitual para FTP/SFTP es…', opts: ['FileZilla', 'Wireshark', 'htop', 'Postman'], ans: [0], why: 'FileZilla soporta FTP, FTPS y SFTP.' },
    { ra: 'RA4', crit: 'd', ap: 'UD2 · Clientes FTP', q: '¿Qué comando muestra el directorio remoto actual en un cliente ftp de consola?', opts: ['pwd', 'lpwd', 'cd ..', 'prompt'], ans: [0], why: 'pwd muestra la ruta remota; lcd cambia el directorio local (lpwd no existe en el cliente ftp clásico, solo en alguno como lftp).' },
    { ra: 'RA4', crit: 'e', ap: 'UD2 · SFTP y SSH', q: '¿Qué diferencia hay entre FTPS y SFTP?', opts: ['FTPS es FTP sobre TLS; SFTP es un subsistema de SSH', 'Son el mismo protocolo', 'SFTP usa el puerto 21 y FTPS el 22', 'FTPS no cifra'], ans: [0], why: 'SFTP usa el puerto 22 de SSH. FTPS mantiene FTP (21 + datos) y añade TLS.' },
    { ra: 'RA4', crit: 'e', ap: 'UD2 · SFTP y SSH', q: '¿Qué comando genera un par de claves SSH?', opts: ['ssh-keygen', 'ssh-copy-id', 'sftp-key', 'openssl ssh'], ans: [0], why: 'ssh-keygen crea la privada y la pública; ssh-copy-id instala la pública en el servidor.' },
    { ra: 'RA4', crit: 'e', ap: 'UD2 · SFTP y SSH', q: '¿Qué línea de sshd_config enjaula a un grupo de usuarios solo con SFTP?', opts: ['ForceCommand internal-sftp junto a ChrootDirectory dentro de un bloque Match Group', 'PermitRootLogin yes', 'Port 22', 'X11Forwarding yes'], ans: [0], why: 'Match Group sftpusers + ChrootDirectory + ForceCommand internal-sftp. El directorio raíz del chroot debe ser propiedad de root.' },
    { ra: 'RA4', crit: 'e', ap: 'UD2 · SFTP y SSH', q: '¿Qué ajuste de sshd_config endurece el acceso del administrador?', opts: ['PermitRootLogin no', 'PermitEmptyPasswords yes', 'Protocol 1', 'LogLevel QUIET'], ans: [0], why: 'No permitir root remoto obliga a entrar con un usuario normal y elevar privilegios.' },
    { ra: 'RA4', crit: 'f', ap: 'Transferencia integrada en servidores web', q: '¿Qué protocolo permite subir ficheros a través de un servidor web mediante HTTP?', opts: ['WebDAV', 'SMTP', 'DHCP', 'SNMP'], ans: [0], why: 'WebDAV extiende HTTP con métodos como PUT, MKCOL o PROPFIND; en Apache se activa con mod_dav.' },
    { ra: 'RA4', crit: 'f', ap: 'Transferencia integrada en servidores web', q: '¿Qué módulos de Apache habilitan WebDAV?', opts: ['dav y dav_fs', 'ssl y rewrite', 'alias y dir', 'proxy y cache'], ans: [0], why: 'a2enmod dav dav_fs y la directiva Dav On en el Directory o Location.' },
    { ra: 'RA4', crit: 'g', ap: 'Documentación del servicio', q: '¿Qué debe recoger la documentación de un servicio FTP?', opts: ['Instalación, ficheros de configuración, usuarios, puertos/rango pasivo, pruebas y medidas de seguridad', 'Solo el nombre del programa', 'La contraseña de todos los usuarios', 'Nada si funciona'], ans: [0], why: 'Debe permitir reproducir el servicio sin incluir credenciales.' },
    { ra: 'RA4', crit: 'h', ap: 'Contenedores y nube', q: '¿Por qué es delicado ejecutar FTP en modo pasivo en un contenedor?', opts: ['Hay que publicar también el rango de puertos pasivos', 'Los contenedores no tienen red', 'FTP no funciona en Linux', 'Docker bloquea el puerto 21'], ans: [0], why: 'Además de -p 21:21, hay que publicar el rango pasivo (por ejemplo 40000-40100) y fijar la IP anunciada.' },
    { ra: 'RA4', crit: 'h', ap: 'Contenedores y nube', q: '¿Qué mecanismo evita perder los ficheros subidos cuando se recrea el contenedor FTP?', opts: ['Un volumen o bind mount', 'Reiniciar el contenedor', 'docker stop', 'Cambiar de imagen'], ans: [0], why: 'Los datos del contenedor son efímeros; un volumen los guarda fuera de su ciclo de vida.' }
  ],
  practice: [
    { id: 'dep-p1', ra: 'RA2', crits: ['a', 'c', 'j'], ap: 'UD2 · Hosts virtuales', titulo: 'Host virtual por nombre', lang: 'apache',
      brief: 'Escribe el VirtualHost del sitio www.tienda.local en el puerto 80. Requisitos: administrador admin@tienda.local, alias tienda.local, raíz en /var/www/tienda, logs propios en /var/log/apache2/tienda_error.log (ErrorLog) y tienda_access.log (CustomLog formato combined), y el directorio con Require all granted y AllowOverride None.',

    { ra: 'RA2', crit: 'h', ap: 'UD2 · Variables CSS', q: '¿Qué permite el segundo argumento de var(--x, red)?', opts: ['Un valor alternativo si --x no está definida', 'Un segundo color simultáneo', 'Un retraso', 'Nada'], ans: [0], why: 'Si la variable no existe, se usa el valor de respaldo.' }

  practice: [
    { id: 'diw-p1', ra: 'RA2', crits: ['b'], ap: 'UD2 · Selectores', titulo: 'Selectores: elige bien a quién apuntas', lang: 'css', preview: true,
      brief: 'Escribe el CSS para: 1) los enlaces dentro de .menu de color navy; 2) el enlace con clase activo en negrita; 3) el párrafo con id aviso con fondo amarillo; 4) el primer li de .menu con tamaño de letra 20px; 5) los p con clase nota de color gray.',
      files: [
        { name: 'index.html', ro: true, code: '<nav class="menu"><ul>\n  <li><a href="#" class="activo">Inicio</a></li>\n  <li><a href="#">Tienda</a></li>\n  <li><a href="#">Contacto</a></li>\n</ul></nav>\n<p id="aviso">Envíos gratis esta semana</p>\n<p class="nota">Precios con IVA incluido</p>\n<p>Texto normal</p>' },
        { name: 'style.css', code: '/* Escribe tus reglas */\n' }
      ],
      checks: [
        { label: '.menu a de color navy', test: c => c.rgb('.menu li:nth-child(2) a', 'color') === 'rgb(0, 0, 128)', hint: 'Selector de descendiente: .menu a { color: navy; }' },
        { label: '.activo en negrita', test: c => +c.css('.activo', 'fontWeight') >= 600, hint: 'font-weight: bold (o 700) sobre la clase .activo.' },
        { label: '#aviso con fondo amarillo', test: c => c.rgb('#aviso', 'backgroundColor') === 'rgb(255, 255, 0)', hint: 'El id se escribe con #: #aviso { background-color: yellow; }' },
        { label: 'Primer li de .menu a 20px', test: c => c.css('.menu li:first-child', 'fontSize') === '20px' && c.css('.menu li:nth-child(2)', 'fontSize') !== '20px', hint: 'Pseudo-clase :first-child sobre li. Solo debe cambiar el primero.' },
        { label: 'p.nota de color gray', test: c => c.rgb('p.nota', 'color') === 'rgb(128, 128, 128)' && c.rgb('p:last-child', 'color') !== 'rgb(128, 128, 128)', hint: 'p.nota { color: gray; } sin tocar los demás párrafos.' }
      ],
      solution: '.menu a { color: navy; }\n.activo { font-weight: bold; }\n#aviso { background-color: yellow; }\n.menu li:first-child { font-size: 20px; }\np.nota { color: gray; }\n' },
    { id: 'diw-p2', ra: 'RA2', crits: ['e'], ap: 'UD2 · Modelo de caja', titulo: 'Modelo de caja y centrado', lang: 'css', preview: true,
      brief: 'Haz que .caja ocupe en total 300px de ancho (contando relleno y borde), con 20px de relleno, un borde de 2px sólido y esté centrada horizontalmente con margin auto.',
      files: [
        { name: 'index.html', ro: true, code: '<div class="caja">Contenido de la caja</div>' },
        { name: 'style.css', code: '.caja {\n  background: #e8f1ff;\n}\n' }
      ],
      checks: [
        { label: 'Ancho total de 300px', test: c => Math.round(c.rect('.caja').width) === 300, hint: 'Con box-sizing: border-box, width incluye relleno y borde.' },
        { label: 'padding de 20px', test: c => c.css('.caja', 'paddingLeft') === '20px' && c.css('.caja', 'paddingTop') === '20px', hint: 'padding: 20px;' },
        { label: 'Borde de 2px sólido', test: c => c.css('.caja', 'borderTopWidth') === '2px' && c.css('.caja', 'borderTopStyle') === 'solid', hint: 'border: 2px solid algúncolor;' },
        { label: 'Centrada horizontalmente', test: c => { const r = c.rect('.caja'); const w = c.win.innerWidth; return Math.abs(r.left - (w - r.right)) <= 1 && r.left > 20; }, hint: 'margin: 0 auto; (hace falta un ancho definido).' }
      ],
      solution: '.caja {\n  background: #e8f1ff;\n  box-sizing: border-box;\n  width: 300px;\n  padding: 20px;\n  border: 2px solid #335;\n  margin: 0 auto;\n}\n' },
    { id: 'diw-p3', ra: 'RA2', crits: ['f'], ap: 'UD2 · Flexbox', titulo: 'Menú horizontal con Flexbox', lang: 'css', preview: true,
      brief: 'Convierte la lista en un menú horizontal: sin viñetas, con display flex, elementos repartidos con espacio entre ellos, centrados verticalmente y con 16px de separación mínima.',
      files: [
        { name: 'index.html', ro: true, code: '<ul class="menu">\n  <li>Inicio</li><li>Productos</li><li>Blog</li><li>Contacto</li>\n</ul>' },
        { name: 'style.css', code: '.menu {\n  \n}\n' }
      ],
      checks: [
        { label: 'Sin viñetas (list-style: none)', test: c => c.css('.menu', 'listStyleType') === 'none', hint: 'list-style: none; en el ul.' },
        { label: 'display: flex', test: c => c.css('.menu', 'display') === 'flex', hint: 'El contenedor es el ul, no los li.' },
        { label: 'justify-content: space-between', test: c => c.css('.menu', 'justifyContent') === 'space-between', hint: 'justify-content reparte el espacio en el eje principal.' },
        { label: 'align-items: center', test: c => c.css('.menu', 'alignItems') === 'center', hint: 'align-items actúa en el eje transversal.' },
        { label: 'gap de 16px', test: c => c.css('.menu', 'columnGap') === '16px', hint: 'gap: 16px;' },
        { label: 'Los elementos están en una fila', test: c => { const a = c.rect('.menu li:nth-child(1)'), b = c.rect('.menu li:nth-child(2)'); return Math.abs(a.top - b.top) < 2; }, hint: 'Con flex-direction row (por defecto) quedan en línea.' }
      ],
      solution: '.menu {\n  list-style: none;\n  padding: 0;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 16px;\n}\n' },
    { id: 'diw-p4', ra: 'RA2', crits: ['f'], ap: 'UD2 · Grid', titulo: 'Galería con Grid', lang: 'css', preview: true,
      brief: 'Crea una galería con grid de 3 columnas iguales y 12px de separación entre filas y columnas.',
      files: [
        { name: 'index.html', ro: true, code: '<div class="galeria">\n  <div class="item">1</div><div class="item">2</div><div class="item">3</div>\n  <div class="item">4</div><div class="item">5</div><div class="item">6</div>\n</div>' },
        { name: 'style.css', code: '.item { background: #d9ecff; padding: 16px; }\n.galeria {\n  \n}\n' }
      ],
      checks: [
        { label: 'display: grid', test: c => c.css('.galeria', 'display') === 'grid', hint: 'En el contenedor .galeria.' },
        { label: '3 columnas', test: c => c.css('.galeria', 'gridTemplateColumns').trim().split(/\s+/).length === 3, hint: 'grid-template-columns: repeat(3, 1fr);' },
        { label: 'Columnas de igual ancho', test: c => { const t = c.css('.galeria', 'gridTemplateColumns').trim().split(/\s+/).map(parseFloat); return t.length === 3 && Math.abs(t[0] - t[1]) < 1 && Math.abs(t[1] - t[2]) < 1; }, hint: 'Usa fr para repartir de forma equitativa.' },
        { label: 'gap de 12px', test: c => c.css('.galeria', 'rowGap') === '12px' && c.css('.galeria', 'columnGap') === '12px', hint: 'gap: 12px;' },
        { label: 'Dos filas de tres elementos', test: c => { const a = c.rect('.item:nth-child(3)'), b = c.rect('.item:nth-child(4)'); return b.top > a.top + 5 && b.left < a.left; }, hint: 'Con 3 columnas, el cuarto elemento pasa a la segunda fila.' }
      ],
      solution: '.item { background: #d9ecff; padding: 16px; }\n.galeria {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 12px;\n}\n' },
    { id: 'diw-p5', ra: 'RA2', crits: ['c'], ap: 'UD2 · Pseudo-clases y pseudo-elementos', titulo: 'Pseudo-clases y pseudo-elementos', lang: 'css', preview: true,
      brief: 'Escribe CSS para: 1) añadir " €" después de cada .precio con ::after; 2) fondo rgb(240,240,240) en los li impares con :nth-child; 3) que los enlaces cambien de color con :hover (escribe la regla a:hover).',
      files: [
        { name: 'index.html', ro: true, code: '<ul>\n  <li>Café <span class="precio">4</span></li>\n  <li>Té <span class="precio">3</span></li>\n  <li>Cacao <span class="precio">5</span></li>\n  <li>Leche <span class="precio">2</span></li>\n</ul>\n<a href="#">Ver carta</a>' },
        { name: 'style.css', code: '/* Tus reglas */\n' }
      ],
      checks: [
        { label: '.precio::after con content " €"', test: c => /€/.test(c.pseudo('.precio', '::after', 'content')), hint: 'Los pseudo-elementos necesitan content: " €";' },
        { label: 'li impares con fondo rgb(240,240,240)', test: c => c.rgb('li:nth-child(1)', 'backgroundColor') === 'rgb(240, 240, 240)' && c.rgb('li:nth-child(3)', 'backgroundColor') === 'rgb(240, 240, 240)', hint: 'li:nth-child(odd) { background: rgb(240,240,240); }' },
        { label: 'Los li pares sin ese fondo', test: c => c.rgb('li:nth-child(2)', 'backgroundColor') !== 'rgb(240, 240, 240)', hint: 'Solo los impares.' },
        { label: 'Regla a:hover con cambio de color', test: c => /a:hover\s*\{[^}]*\bcolor\s*:/i.test(c.css_src), hint: 'a:hover { color: algún_color; }' }
      ],
      solution: '.precio::after { content: " €"; }\nli:nth-child(odd) { background: rgb(240, 240, 240); }\na:hover { color: crimson; }\n' },
    { id: 'diw-p6', ra: 'RA2', crits: ['h', 'g'], ap: 'UD2 · Variables y media queries', titulo: 'Variable CSS y diseño responsivo', lang: 'css', preview: true,
      brief: 'Define la variable --color-principal con el valor #00aa77 en :root y úsala en .titulo mediante var(). Después, con una media query, haz que .contenedor pase a columna cuando la ventana mida 600px o menos (en pantallas mayores debe seguir en fila).',
      files: [
        { name: 'index.html', ro: true, code: '<h1 class="titulo">Mi tienda</h1>\n<div class="contenedor">\n  <div class="col">A</div><div class="col">B</div><div class="col">C</div>\n</div>' },
        { name: 'style.css', code: '.contenedor { display: flex; gap: 8px; }\n.col { flex: 1; background: #eef; padding: 12px; }\n' }
      ],
      checks: [
        { label: 'Variable --color-principal: #00aa77 en :root', test: c => /:root\s*\{[^}]*--color-principal\s*:\s*(#0a7|#00aa77)\s*;?/i.test(c.css_src), hint: ':root { --color-principal: #00aa77; }' },
        { label: '.titulo usa var(--color-principal)', test: c => /\.titulo\s*\{[^}]*var\(\s*--color-principal/i.test(c.css_src), hint: '.titulo { color: var(--color-principal); }' },
        { label: '.titulo se pinta con ese verde', test: c => c.rgb('.titulo', 'color') === 'rgb(0, 170, 119)', hint: 'Comprueba que la variable está definida y que el nombre coincide.' },
        { label: 'Con 900px de ancho, .contenedor está en fila', test: c => c.atWidth(900, () => c.css('.contenedor', 'flexDirection')) === 'row', hint: 'Sin media query activa, el valor por defecto de flex-direction es row.' },
        { label: 'Con 500px de ancho, .contenedor está en columna', test: c => c.atWidth(500, () => c.css('.contenedor', 'flexDirection')) === 'column', hint: '@media (max-width: 600px) { .contenedor { flex-direction: column; } }' }
      ],
      solution: ':root { --color-principal: #00aa77; }\n.titulo { color: var(--color-principal); }\n.contenedor { display: flex; gap: 8px; }\n.col { flex: 1; background: #eef; padding: 12px; }\n@media (max-width: 600px) {\n  .contenedor { flex-direction: column; }\n}\n' },
    { id: 'diw-p7', ra: 'RA2', crits: ['d'], ap: 'UD2 · Cascada y especificidad', titulo: 'Gana la cascada sin !important', lang: 'css', preview: true,
      brief: 'El precio de la oferta debe verse en crimson, pero la hoja ya tiene otras reglas. Añade una regla para que el .precio dentro de .destacado sea crimson, sin usar !important ni cambiar las reglas existentes.',
      files: [
        { name: 'index.html', ro: true, code: '<div class="producto destacado">\n  <p class="precio">10 €</p>\n</div>\n<div class="producto">\n  <p class="precio">8 €</p>\n</div>' },
        { name: 'style.css', code: 'p { color: blue; }\n.producto .precio { color: gray; }\n\n/* Añade tu regla debajo */\n' }
      ],
      checks: [
        { label: 'El precio destacado es crimson', test: c => c.rgb('.destacado .precio', 'color') === 'rgb(220, 20, 60)', hint: 'Necesitas un selector con especificidad igual o mayor que .producto .precio y que vaya después.' },
        { label: 'El otro precio sigue gris', test: c => c.rgb('.producto:not(.destacado) .precio', 'color') === 'rgb(128, 128, 128)', hint: 'Limita tu regla a .destacado.' },
        { label: 'Sin !important', test: c => !/!important/i.test(c.css_src), hint: 'Quita !important; cuenta las clases del selector.' },
        { label: 'Las reglas originales siguen intactas', test: c => /p\s*\{\s*color:\s*blue;\s*\}/.test(c.css_src) && /\.producto \.precio\s*\{\s*color:\s*gray;\s*\}/.test(c.css_src), hint: 'No borres ni cambies las dos reglas de arriba.' }
      ],
      solution: 'p { color: blue; }\n.producto .precio { color: gray; }\n\n.destacado .precio { color: crimson; }\n' },
    { id: 'diw-p8', ra: 'RA1', crits: ['h'], raExtra: [{ ra: 'RA1', crit: 'i' }], ap: 'UD1 · HTML semántico (repaso)', titulo: 'Tienda de café con HTML semántico', lang: 'html', preview: true,
      brief: 'Crea la página de una tienda de café con HTML semántico. Requisitos: <!DOCTYPE html>, lang="es", un <header> con un <h1>, una <section> con un <h2> "Nuestros Productos" y al menos tres <article> (cada uno con h3, img con alt, p, un precio destacado con <strong> y un enlace <a>), y una <section> con un formulario (nombre, correo, mensaje y botón de envío) donde cada campo tenga su <label>. Incluye comentarios HTML.',
      files: [{ name: 'index.html', code: '<!DOCTYPE html>\n<html lang="es">\n<head>\n  <meta charset="utf-8">\n  <title>Café de especialidad</title>\n</head>\n<body>\n  <\!-- Escribe aquí el contenido -->\n</body>\n</html>\n' }],
      checks: [
        { label: '<!DOCTYPE html> y lang="es"', test: c => /<!DOCTYPE html>/i.test(c.src) && (c.doc.documentElement.getAttribute('lang') || '').toLowerCase().startsWith('es'), hint: 'La primera línea es <!DOCTYPE html> y <html lang="es">.' },
        { label: 'Estructura: <head> con <title> y <body> explícitos', test: c => /<head[\s>][\s\S]*<title>[^<]+<\/title>[\s\S]*<\/head>/i.test(c.src) && /<body[\s>][\s\S]*<\/body>/i.test(c.src), hint: 'Escribe <head> con <title> y <body> completos.' },
        { label: 'Hay <header> con <h1>', test: c => !!c.doc.querySelector('header h1'), hint: 'El h1 va dentro del header.' },
        { label: 'El <header> está cerrado antes de las secciones', test: c => !!c.doc.querySelector('header') && !c.doc.querySelector('header section'), hint: 'Cierra </header> antes de abrir la primera <section>.' },
        { label: 'Las <section> están cerradas y no anidadas', test: c => c.doc.querySelectorAll('section').length >= 2 && !c.doc.querySelector('section section') && !c.doc.querySelector('section > section'), hint: 'Cierra cada </section> antes de abrir la siguiente.' },
        { label: 'Un único <h1>', test: c => c.doc.querySelectorAll('h1').length === 1, hint: 'Solo un h1 por página.' },
        { label: '<section> con <h2> «Nuestros Productos»', test: c => [...c.doc.querySelectorAll('section h2')].some(h => /nuestros productos/i.test(h.textContent)), hint: 'Una section que contenga un h2 con ese título.' },
        { label: 'Al menos 3 <article> en esa sección', test: c => [...c.doc.querySelectorAll('section')].some(s => /nuestros productos/i.test((s.querySelector('h2') || {}).textContent || '') && s.querySelectorAll('article').length >= 3), hint: 'Tres article dentro de la section de productos.' },
        { label: 'Cada article: h3, img con alt, p, strong y a', test: c => { const a = [...c.doc.querySelectorAll('article')]; return a.length >= 3 && a.every(x => x.querySelector('h3') && x.querySelector('img[alt]:not([alt=""])') && x.querySelector('p') && x.querySelector('strong') && x.querySelector('a[href]')); }, hint: 'Revisa que ningún article se deje alguno de los cinco elementos.' },
        { label: 'Formulario con nombre, correo, mensaje y botón', test: c => { const f = c.doc.querySelector('form'); return !!f && !!f.querySelector('input[type=text]') && !!f.querySelector('input[type=email]') && !!f.querySelector('textarea') && !!f.querySelector('button[type=submit], input[type=submit], button:not([type])'); }, hint: 'input text, input email, textarea y un botón de envío dentro de <form>.' },
        { label: 'Cada campo tiene su <label>', test: c => { const f = c.doc.querySelector('form'); if (!f) return false; const campos = [...f.querySelectorAll('input:not([type=submit]):not([type=hidden]), textarea')]; return campos.length >= 3 && campos.every(i => (i.id && f.querySelector('label[for="' + i.id + '"]')) || i.closest('label')); }, hint: '<label for="x"> y el campo con id="x", o el campo dentro del label.' },
        { label: 'Hay comentarios HTML', test: c => (c.src.match(/<\!--[\s\S]*?-->/g) || []).length >= 2, hint: 'Usa <\!-- comentario --> al menos dos veces.' }
      ],
      solution: '<!DOCTYPE html>\n<html lang="es">\n<head>\n  <meta charset="utf-8">\n  <title>Café de especialidad</title>\n</head>\n<body>\n  <\!-- Cabecera -->\n  <header>\n    <h1>Café del Norte</h1>\n    <p>Tostado artesanal cada semana</p>\n  </header>\n  <\!-- Productos -->\n  <section>\n    <h2>Nuestros Productos</h2>\n    <article><h3>Etiopía</h3><img src="a.jpg" alt="Bolsa de café Etiopía"><p>Notas florales.</p><strong>9,50 €</strong> <a href="#">Comprar</a></article>\n    <article><h3>Colombia</h3><img src="b.jpg" alt="Bolsa de café Colombia"><p>Dulce y equilibrado.</p><strong>8,90 €</strong> <a href="#">Comprar</a></article>\n    <article><h3>Kenia</h3><img src="c.jpg" alt="Bolsa de café Kenia"><p>Acidez brillante.</p><strong>10,20 €</strong> <a href="#">Comprar</a></article>\n  </section>\n  <section>\n    <h2>Contacto</h2>\n    <form>\n      <label for="n">Nombre</label><input id="n" type="text">\n      <label for="e">Correo</label><input id="e" type="email">\n      <label for="m">Mensaje</label><textarea id="m"></textarea>\n      <button type="submit">Enviar</button>\n    </form>\n  </section>\n</body>\n</html>\n' },
    { id: 'diw-p9', ra: 'RA1', crits: ['a', 'b'], ap: 'UD1 · Accesibilidad', titulo: 'Arregla la accesibilidad de esta página', lang: 'html', preview: true,
      brief: 'Esta página tiene fallos de accesibilidad. Corrígelos: idioma de la página, texto alternativo en las imágenes informativas, el falso botón (div con onclick) debe ser un <button>, cada campo del formulario necesita su <label> asociado, y los encabezados no deben saltarse niveles.',
      files: [{ name: 'index.html', code: '<!DOCTYPE html>\n<html>\n<head><meta charset="utf-8"><title>Reservas</title></head>\n<body>\n  <h1>Reservas del restaurante</h1>\n  <h4>Elige tu mesa</h4>\n  <img src="mesa.jpg">\n  <form>\n    <input type="text" id="nombre" placeholder="Nombre">\n    <input type="email" id="correo" placeholder="Correo">\n    <div onclick="enviar()">Reservar</div>\n  </form>\n</body>\n</html>\n' }],
      checks: [
        { label: 'Empieza con <!DOCTYPE html>', test: c => /^\s*<!DOCTYPE html>/i.test(c.src), hint: 'La primera línea del documento.' },
        { label: 'La página declara el idioma (lang="es")', test: c => (c.doc.documentElement.getAttribute('lang') || '').toLowerCase().startsWith('es'), hint: 'Atributo lang en <html>.' },
        { label: 'La imagen tiene alt descriptivo', test: c => { const i = [...c.doc.querySelectorAll('img')]; return i.length > 0 && i.every(x => (x.getAttribute('alt') || '').trim().length > 2); }, hint: 'alt="Descripción de lo que muestra la imagen".' },
        { label: 'Hay un <button> y no queda ningún div con onclick', test: c => !!c.doc.querySelector('button') && !c.doc.querySelector('div[onclick]'), hint: 'Sustituye el div por <button type="submit">.' },
        { label: 'Cada campo tiene un <label> asociado', test: c => { const f = c.doc.querySelector('form'); const campos = [...f.querySelectorAll('input:not([type=submit]):not([type=hidden])')]; return campos.length >= 2 && campos.every(i => (i.id && f.querySelector('label[for="' + i.id + '"]')) || i.closest('label')); }, hint: '<label for="nombre">Nombre</label>.' },

<script>
// Juego multijugador casual: puntos, rachas, insignias y ranking compartido.
// Sin cuentas ni contraseñas: solo un apodo, y los récords cuentan bajo ese apodo.
//
// FÓRMULA (solo preguntas de examen y ejercicios de examen; lo marcado como tarea `t` NO puntúa):
//   puntos = base + rapidez + racha                       (solo la 1.ª vez que se acierta cada ítem)
//   base    = 10 por pregunta de test, 30 por ejercicio resuelto
//   rapidez = test: max(0, 5 - floor(seg/6))   (0 tras 30 s)
//             práctica: max(0, 15 - floor(min))  (0 tras 15 min)
//   racha   = min(racha - 1, 10) * 2   (racha = aciertos seguidos incluyendo este)
//   Un fallo no resta nada: solo pone la racha a 0. % acierto = aciertos / respuestas.
//
// RANKING COMPARTIDO (colección `rank` de la capability db): un documento por dispositivo,
// id = <slug-del-apodo>~<idDispositivo>. Cada dispositivo escribe SOLO su documento (sin
// condiciones de carrera ni contadores leer-modificar-escribir) y el cliente suma por apodo:
// si dos personas usan el mismo apodo, sus datos se suman sin error.
(function () {
'use strict';
const MODS = window.MODS || {};
const ORDER = ['dep', 'dwes', 'diw', 'sos'];
const KEY = 'daw2-game-v1', RKEY = 'daw2-game-rank-v1';
const BADGES = { first: 'Primera sangre', s5: 'Racha de 5', s10: 'Racha de 10', p100: 'Centenario (100 pts)' };
ORDER.forEach(id => { if (MODS[id]) BADGES['mod:' + id] = 'Asignatura completada: ' + (MODS[id].corto || id); });

// ---------- estado local ----------
const blank = () => ({ nick: '', dev: Math.random().toString(36).slice(2, 10), pts: 0, ok: 0, tot: 0, streak: 0, best: 0, badges: [], m: {}, done: {} });
let S = blank();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (e) { /* sin almacenamiento */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ } }
function mm(id) { return S.m[id] || (S.m[id] = { pts: 0, ok: 0, tot: 0 }); }

function cleanNick(s) { return String(s == null ? '' : s).normalize('NFC').replace(/[\u0000-\u001f\u007f<>"'`&\\\/]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16).trim(); }
function badNick(n) { return /@|https?:|www\./i.test(n) || /\d{6,}/.test(n.replace(/[\s.-]/g, '')); } // evita correos, enlaces y teléfonos
function slugOf(n) { return n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'jugador'; }
const docId = () => slugOf(S.nick) + '~' + S.dev;
const num = v => (Number.isFinite(v) ? Math.max(0, Math.min(v, 1e6)) : 0);
function myDoc() { return { nick: S.nick, slug: slugOf(S.nick), pts: S.pts, ok: S.ok, tot: S.tot, best: S.best, badges: S.badges, m: S.m, ts: Date.now() }; }

// ---------- almacenamiento: compartido (db) o solo local ----------
let mode = 'local', db = null, api = false; // local | shared | readonly ; api = servidor propio (Render)
const lget = () => { try { return JSON.parse(localStorage.getItem(RKEY)) || {}; } catch (e) { return {}; } };
const lset = o => { try { localStorage.setItem(RKEY, JSON.stringify(o)); } catch (e) { /* sin almacenamiento */ } };
// Servidor propio: solo existe cuando la web se sirve desde el servidor de ranking (Render). Cualquiera puede leer y escribir.
async function apiCall(path, opt) {
  const r = await fetch(path, Object.assign({ cache: 'no-store' }, opt || {}));
  if (!r.ok) { const e = new Error('http ' + r.status); e.code = r.status === 429 ? 'rate' : (r.status >= 400 && r.status < 500 ? 'invalid_argument' : 'server'); throw e; }
  return r;
}
async function listDocs() {
  if (api) return (await apiCall('/api/rank')).json();
  if (db && mode !== 'local') {
    const snap = await db.collection('rank').limit(1000).get();
    return snap.docs.map(d => d.data());
  }
  return Object.values(lget());
}
async function writeDoc(id, doc) {
  if (api) { await apiCall('/api/rank/' + encodeURIComponent(id), { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(doc) }); return; }
  if (db && mode !== 'local') return db.collection('rank').doc(id).set(doc);
  const o = lget(); o[id] = doc; lset(o);
}
async function delDoc(id) {
  if (api) { await apiCall('/api/rank/' + encodeURIComponent(id), { method: 'DELETE' }); return; }
  if (db && mode !== 'local') return db.collection('rank').doc(id).delete();
  const o = lget(); delete o[id]; lset(o);
}
let pushing = false, dirty = false, timer = 0;
function push() { if (!S.nick) return; clearTimeout(timer); timer = setTimeout(flush, mode === 'shared' ? 1200 : 0); }
async function flush() {
  if (pushing) { dirty = true; return; }
  if (!S.nick || mode === 'readonly') return;
  pushing = true; dirty = false;
  try { await writeDoc(docId(), myDoc()); }
  catch (e) {
    if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) mode = 'readonly'; // sin permiso de escritura
    else { clearTimeout(timer); timer = setTimeout(flush, 5000); }
  }
  pushing = false; if (dirty) flush();
}
(async () => {
  // 1) servidor propio (Render): responde JSON en /api/rank. En el artifact o en local no existe y se pasa al siguiente.
  try {
    if (/^https?:$/.test(location.protocol)) {
      const r = await fetch('/api/rank', { cache: 'no-store' });
      if (r.ok && /json/.test(r.headers.get('content-type') || '')) { api = true; mode = 'shared'; push(); return; }
    }
  } catch (e) { api = false; }
  // 2) base de datos compartida del artifact (solo escriben quienes tengan permiso de colaborador o superior)
  try {
    if (window.claude && window.claude.use) { db = await window.claude.use('db'); if (db) { mode = 'shared'; push(); } }
  } catch (e) { db = null; }
})();

// ---------- puntuar ----------
function examTotal(id) { const m = MODS[id]; return m ? m.theory.filter(q => !q.t).length + m.practice.filter(p => !p.t).length : 0; }

        h('ul', null, Object.keys(r.crits).map(c => {
          const est = r.estado ? r.estado[c] : null; const d = (r.detalle && r.detalle[c]) || {};
          return h('li', { class: est ? 'row ' + est : '' }, h('b', null, c + ')'), ' ' + r.crits[c],
            est ? h('span', { class: 'est ' + est }, ESTADO_TXT[est]) : null,
            d.dentro && est ? h('span', { class: 'dentro' }, 'Examen: ' + d.dentro) : null,
            d.fuera ? h('span', { class: 'fuera' }, 'Ya en tarea: ' + d.fuera) : null);
        })))),
      h('p', { class: 'sumnote' }, m.nota));
  });
  return h('main', { class: 'wrap' },
    h('section', { class: 'hero' }, h('h1', null, 'Qué se evalúa en la 1ª evaluación'),
      h('p', null, 'Resultados de aprendizaje (RA) no dualizados y los apartados de cada uno. Despliegue, Sostenibilidad y Diseño de interfaces usan los criterios oficiales de su programación; en Entorno servidor los apartados salen del temario del aula.')),
    h('div', { class: 'sumgrid' }, blocks));
}

// ---------- render ----------
function render() {
  const r = route();
  $app.textContent = '';
  $app.append(header(r));
  if (r.ranking && window.DAWGame) { document.body.removeAttribute('data-mod'); $app.append(window.DAWGame.view(h)); document.title = 'Ranking'; return; }
  if (r.summary) { document.body.removeAttribute('data-mod'); $app.append(viewSummary()); document.title = 'Resumen de RA'; return; }
  if (!r.mod) { $app.append(viewHome()); document.title = 'Repaso 1ª evaluación DAW 2'; return; }
  const m = MODS[r.mod];
  document.body.setAttribute('data-mod', m.id);
  const main = h('main', { class: 'wrap' }, modHead(m, r.view));
  if (r.view === 'teoria') main.append(viewTheory(m));
  else if (r.view === 'practica') main.append(viewPractice(m));
  else main.append(viewCoverage(m));
  $app.append(main);
}
window.addEventListener('hashchange', () => { if (W.open && route().view !== 'practica') { clearInterval(W.timer); W.open = null; delete W.st; } if (!route().mod) document.body.removeAttribute('data-mod'); render(); });
render();

// ---------- autocomprobación (se invoca desde fuera con window.__selfTest()) ----------
window.__evaluate = evaluate; // solo para pruebas
window.__selfTest = async function () {
  const out = { cobertura: [], teoria: [], practica: [] };
  for (const id of ORDER) {
    const m = MODS[id];
    m.ras.forEach(r => Object.keys(r.crits).forEach(c => {
      const est = estadoDe(m, r.ra, c);
      const tn = m.theory.filter(q => q.ra === r.ra && q.crit === c && !q.t).length;
      const ta = m.theory.filter(q => q.ra === r.ra && q.crit === c).length;
      const pn = m.practice.filter(p => !p.t && pairs(p).some(([ra, cc]) => ra === r.ra && cc === c)).length;
      if (!ta) out.cobertura.push(id + ' ' + r.ra + ' ' + c + ' sin preguntas');
      if (est !== 'tarea' && !tn) out.cobertura.push(id + ' ' + r.ra + ' ' + c + ' sin preguntas de examen');
      if (est === 'tarea' && tn) out.cobertura.push(id + ' ' + r.ra + ' ' + c + ' marcado como tarea pero tiene preguntas de examen');
      if (est !== 'tarea' && !tn && !pn) out.cobertura.push(id + ' ' + r.ra + ' ' + c + ' SIN COBERTURA');
      if (r.estado && !r.estado[c]) out.cobertura.push(id + ' ' + r.ra + ' ' + c + ' sin estado');
    }));
    m.theory.forEach((q, i) => {
      const r = m.ras.find(x => x.ra === q.ra);
      if (!r || !r.crits[q.crit]) out.teoria.push(id + '#' + i + ' RA/criterio inexistente ' + q.ra + q.crit);
      if (!q.ans || !q.ans.length || q.ans.some(a => a >= q.opts.length)) out.teoria.push(id + '#' + i + ' respuesta fuera de rango');
      if (new Set(q.opts).size !== q.opts.length) out.teoria.push(id + '#' + i + ' opciones repetidas');
      if (!q.why) out.teoria.push(id + '#' + i + ' sin explicación');
    });
    for (const p of m.practice) {
      const r = m.ras.find(x => x.ra === p.ra);
      pairs(p).forEach(([ra, c]) => { const rr = m.ras.find(x => x.ra === ra); if (!rr || !rr.crits[c]) out.practica.push(p.id + ' criterio inexistente ' + ra + c); });
      if (p.kind === 'classify') {
        if (!p.items.every(it => p.cats.includes(it.a))) out.practica.push(p.id + ' respuesta no está en las categorías');
        continue;
      }
      if (p.kind === 'order') continue;
      const sol = {}; p.files.forEach(f => { sol[f.name] = f.code; });
      const ed = p.files.find(f => !f.ro) || p.files[0];
      sol[ed.name] = p.solution;
      const good = await evaluate(p, sol);
      const bad = p.checks.map((c, i) => good[i] ? null : c.label).filter(Boolean);
      if (bad.length) out.practica.push(p.id + ' la solución no cumple: ' + bad.join(' | '));
      const start = {}; p.files.forEach(f => { start[f.name] = f.code; });
      const st = await evaluate(p, start);
      if (st.every(Boolean)) out.practica.push(p.id + ' el enunciado inicial ya cumple todo');
    }
  }
  return out;
};
})();

</script>
